name: Milo OS — Research to draft PR

on:
  workflow_dispatch:
    inputs:
      audit_pr:
        description: 'Existing Milo draft PR number to audit without Gemini usage; leave blank to generate a new guide'
        required: false
        default: ''
        type: string
      test_now:
        description: 'Allow one extra manual test today (uses Gemini credits; creates a draft PR only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: milo-os-single-pipeline
  cancel-in-progress: false

jobs:
  draft-guide:
    name: Research or audit Milo draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Milo's existing safeguards without using Gemini credits
        run: python milo_os.py --self-test
      - name: Generate one draft PR (skip for existing-PR audit)
        if: ${{ inputs.audit_pr == '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MILO_GEMINI_MODEL: gemini-3.5-flash-lite
          MILO_TEST_NOW: ${{ inputs.test_now }}
        run: python milo_os.py
      - name: Editorial quality gate (never merges or publishes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MILO_AUDIT_PR: ${{ inputs.audit_pr }}
        run: |
          cat > /tmp/milo_audit.py <<'PY'
          #!/usr/bin/env python3
          """Milo OS editorial PR gate. Stdlib-only. Never edits site files or merges."""
          import json, os, re, subprocess, sys, urllib.request, urllib.error
          
          MARKER = '<!-- agent-lab-milo-os-editorial-audit -->'
          
          
          def git(*args):
              p = subprocess.run(['git', *args], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if p.returncode:
                  raise RuntimeError('Git command failed: ' + ' '.join(args[:2]))
              return p.stdout.strip()
          
          
          def api(path, *, payload=None):
              repo = os.environ['GITHUB_REPOSITORY']
              token = os.environ['GITHUB_TOKEN']
              url = 'https://api.github.com/repos/' + repo + path
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  **({'Content-Type': 'application/json'} if payload is not None else {})
              })
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.loads(response.read(300000).decode('utf-8'))
          
          
          def text(x):
              return re.sub(r'\s+', ' ', str(x or '')).strip().lower()
          
          
          def check_guide(item):
              """Conservative screening for overpromised tutorials; not factual verification."""
              errors = []
              title = text(item.get('title'))
              tool = text(item.get('tool'))
              steps = [text(x) for x in item.get('steps', []) if isinstance(x, str)]
              combined = ' '.join(steps)
              source = str(item.get('source', '')).lower()
              if len(steps) < 6:
                  errors.append('The guide must contain at least six implementation/test steps.')
              if not re.search(r'(test|trial|example|sample|verify|check)', combined):
                  errors.append('No meaningful testing instructions were found.')
              if not re.search(r'(review|approve|approval|human|manually check)', combined):
                  errors.append('No explicit human review/approval instruction was found.')
              if not re.search(r'(error|failure|invalid|missing|empty|ambiguous|edge case|negative|incorrect|unexpected|blurry|unreadable)', combined):
                  errors.append('No negative or failure-path test was found.')
              if not re.search(r'(expect|expected|should produce|should see|compare .*output|check .*output|output .*matches)', combined):
                  errors.append('No explicit expected test output was found.')
              # Use real specific sample data, not only a request to invent some later.
              if not re.search(r'(for example:|for example,|e\.g\.|sample input:|test input:|such as ["“\']|input ["“\'])', combined):
                  errors.append('No concrete sample input was supplied (e.g., an actual sample item).')
              auto = bool(re.search(r'\b(automate|automated|automatic|automatically|sync|synchronize|schedule|scheduled)\b', title))
              if auto:
                  platform = bool(re.search(r'\b(zapier|n8n|make\.com|make automation|power automate|ifttt|api|webhook)\b', combined))
                  # Activation is a distinct real step, never an optional aspiration.
                  active = [s for s in steps if re.search(r'\b(trigger|webhook|scheduled event|when a|whenever|on submission)\b', s) and re.search(r'\b(configure|select|set|choose|create|start|add|connect)\b', s)
                            and not re.search(r'\b(optional|optionally|if moving beyond|if desired|you could|consider|might|later)\b', s)]
                  action = [s for s in steps if re.search(r'\b(send|write|save|update|add row|route|post|append|store|create .{0,25}(?:row|task|record|ticket))\b', s)
                            and re.search(r'\b(zapier|n8n|make|webhook|api|sheets?|notion|slack|email|calendar|database|crm|task board|inbox)\b', s)
                            and not re.search(r'\b(optional|optionally|if moving beyond|if desired|you could|consider|might|later)\b', s)]
                  if not platform:
                      errors.append('Title promises automation but no automation platform/API setup is explained.')
                  if not active:
                      errors.append('Title promises automation but no mandatory configured trigger is described.')
                  if not action:
                      errors.append('Title promises automation but no mandatory connected output/action is described.')
                  if 'if moving beyond manual' in combined or 'optional automation' in combined:
                      errors.append('Automation is described as optional despite the automated title.')
              if (source.endswith('/') or re.search(r'(what-is-zapier|/overview/?$|/quickstart/?$)', source)) and auto:
                  errors.append('The only cited documentation is a generic vendor overview; verify this specific automated integration.')
              if 'zapier' in tool and 'zapier' not in source and 'zapier' in combined:
                  errors.append('Zapier is required but the single supplied source is not Zapier documentation.')
              return errors
          
          
          def inspect_changes(before, after, changed):
              errors = []
              old = {x['slug']: x for x in before}
              new = {x['slug']: x for x in after}
              added = [x for x in after if x['slug'] not in old]
              if len(added) != 1:
                  return [f'Expected exactly one new guide; found {len(added)}.'], None
              item = added[0]
              for slug, original in old.items():
                  if new.get(slug) != original:
                      errors.append('Existing catalog guide was deleted or modified: '+slug)
                      break
              allow = {'data/use_cases.json', 'index.html', 'directory/index.html',
                       f"guides/{item['slug']}/index.html"}
              unexpected = set(changed) - allow
              if unexpected:
                  errors.append('Unexpected changed files: '+', '.join(sorted(unexpected)[:6]))
              if f"guides/{item['slug']}/index.html" not in changed:
                  errors.append('Generated guide HTML is missing from PR.')
              errors.extend(check_guide(item))
              return errors, item
          
          
          def identify_pr():
              manual = os.environ.get('MILO_AUDIT_PR', '').strip()
              if manual:
                  if not manual.isdigit() or not (0 < int(manual) < 100000000):
                      raise RuntimeError('Audit PR must be a positive integer')
                  pr = api('/pulls/'+manual)
                  if pr['state'] != 'open' or pr['base']['ref'] != 'main':
                      raise RuntimeError('Only open PRs targeting main can be audited')
                  if pr['head']['repo']['full_name'] != os.environ['GITHUB_REPOSITORY']:
                      raise RuntimeError('External or forked PRs are not allowed')
                  if not re.fullmatch(r'milo/guide-[a-z0-9/-]+', pr['head']['ref']):
                      raise RuntimeError('Only Milo draft-guide branches can be audited')
                  git('fetch', '--depth=1', 'origin', 'refs/heads/' + pr['head']['ref'])
                  git('checkout', '--detach', 'FETCH_HEAD')
                  return pr
              branch = git('branch', '--show-current')
              if not branch.startswith('milo/guide-'):
                  print('No new Milo branch created in this run. Nothing to audit.')
                  return None
              prs = api('/pulls?state=open&per_page=100')
              matches = [p for p in prs if p['head']['ref'] == branch and p['base']['ref'] == 'main']
              if not matches:
                  raise RuntimeError('Milo created a branch but no matching PR was found')
              return matches[0]
          
          
          def comment_once(number, summary):
              # Safe to retry without spamming the same exact review.
              comments = api('/issues/'+str(number)+'/comments?per_page=100')
              if any(x.get('body', '') == summary for x in comments):
                  return
              try:
                  api('/issues/'+str(number)+'/comments', payload={'body': summary})
              except (urllib.error.HTTPError, urllib.error.URLError):
                  print('Quality assessment completed, but GitHub denied a PR comment; see job summary.')
          
          
          def main():
              pr = identify_pr()
              if pr is None:
                  return 0
              number = pr['number']
              if not pr.get('draft'):
                  raise RuntimeError('Milo quality gate refuses to inspect a non-draft PR for release readiness')
              git('fetch', '--depth=1', 'origin', 'main')
              base = json.loads(git('show', 'FETCH_HEAD:data/use_cases.json'))
              new = json.loads(open('data/use_cases.json', encoding='utf-8').read())
              files = api('/pulls/'+str(number)+'/files?per_page=100')
              changed = [f['filename'] for f in files]
              errors, item = inspect_changes(base, new, changed)
              status = 'BLOCKED — editorial checks need attention' if errors else 'STRUCTURAL CHECKS PASSED — human factual review required'
              summary = MARKER + '\n### Milo OS automated editorial audit\n\n**' + status + '**\n\n'
              summary += ('\n'.join('- '+s for s in errors) if errors else '- Title, steps, and deterministic guide checks passed.')
              summary += '\n\n**These are heuristic checks, not factual verification.** Verify source relevance and actually test every implementation before merging.\n'
              print(summary)
              summary_file = os.getenv('GITHUB_STEP_SUMMARY')
              if summary_file:
                  with open(summary_file, 'a', encoding='utf-8') as f:
                      f.write('## Milo OS editorial audit for PR #'+str(number)+'\n\n'+summary+'\n')
              comment_once(number, summary)
              if errors:
                  print('Refusing release-readiness status; PR stays draft.')
                  return 1
              print('Structural checks passed; PR remains draft until manually approved.')
              return 0
          
          if __name__ == '__main__':
              try:
                  raise SystemExit(main())
              except (RuntimeError, ValueError, KeyError, urllib.error.HTTPError, urllib.error.URLError) as exc:
                  print('Milo audit stopped: '+str(exc), file=sys.stderr)
                  raise SystemExit(1)
          PY
          python /tmp/milo_audit.py
