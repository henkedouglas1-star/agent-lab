name: Milo v3 — Official-doc article review

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: milo-v3-review
  cancel-in-progress: false

jobs:
  draft:
    name: Research, inspect documentation, prepare human-review guide
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Milo v3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MILO_GEMINI_MODEL: gemini-3.5-flash-lite
        run: python milo_v3.py
