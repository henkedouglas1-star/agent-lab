name: Milo OS — One-time repair PR 5

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: milo-os-repair-pr-5
  cancel-in-progress: false

jobs:
  repair:
    name: Correct PR 5 (does not merge or publish)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the EXISTING draft PR branch
        uses: actions/checkout@v4
        with:
          ref: milo/guide-2026-10-19-automate-personal-task-prioritization-from-mi
          fetch-depth: 0
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and repair the draft PR safely
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > /tmp/milo_repair_pr5.py <<'PY'
          #!/usr/bin/env python3
          """One-time repair of Agent Lab Milo draft PR #5; NEVER touches main.
          Only runs via a manually dispatched GitHub Actions workflow on the known PR branch.
          """
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import urllib.request
          
          REPO = 'henkedouglas1-star/agent-lab'
          BRANCH = 'milo/guide-2026-10-19-automate-personal-task-prioritization-from-mi'
          SLUG = 'automate-personal-task-prioritization-from-mixed-inputs-with-ai'
          DOC_URL = 'https://help.zapier.com/hc/en-us/articles/8496342944013-Use-AI-by-Zapier-to-analyze-and-return-data'
          REQUIRED_PATHS = {'data/use_cases.json', 'guides/'+SLUG+'/index.html'}
          ALLOWED_PATHS = REQUIRED_PATHS | {'index.html', 'directory/index.html'}
          
          FIXED = {
              'slug': SLUG,
              'title': 'Automate Personal Task Prioritization from Mixed Inputs with AI',
              'category': 'Productivity',
              'difficulty': 'Beginner',
              'time': '1–2 hours',
              'tool': 'Google Sheets + AI by Zapier',
              'summary': 'Automatically classify new tasks collected from notes, email, and chats in one Google Sheet, then write priorities and review flags back to each new row.',
              'outcome': 'A task inbox where each incoming spreadsheet row receives a suggested P1/P2/P3 priority and rationale for human review; this does not rank an entire backlog.',
              'audience': 'Solo workers and small-business owners consolidating non-sensitive to-dos from different sources.',
              'steps': [
                  "Create a Google Sheets spreadsheet named Task Inbox with columns Task, Source, Due Window, Impact, Priority, Reason, Needs Review. For example, enter one new test row: Task 'Send client invoice'; Source 'Email'; Due Window blank; Impact 'High'; Due Window can be Today, Tomorrow, This week, Later or blank. Enter a second: Task 'Sort desk drawer'; Source 'Notes'; Due Window blank; Impact 'Low'. For this starter workflow, manually capture tasks from chats, notes, or email into this single sheet; those source apps are not automatically connected.",
                  "In Zapier, create a Zap. Set Google Sheets as the mandatory trigger app and choose the New Spreadsheet Row trigger event (not New or Updated Spreadsheet Row). Connect the Task Inbox spreadsheet and worksheet; configure the trigger to watch for a new row added at the bottom. Test the trigger with your non-sensitive sample row and confirm its row identifier plus the Task and Impact fields appear. This avoids a loop when the Zap later updates Priority and Reason.",
                  "Add AI by Zapier as the required next action. Select a model tier available to your account. In its Prompt map the actual Task, Source, Due Window and Impact values dynamically from the Google Sheets trigger, not fixed example text. Use this rule: P1 when Impact is High or Due Window is Today/Tomorrow; otherwise P2 when Impact is Medium or Due Window is This week; otherwise P3. If Task or Impact is blank, return Review and request manual review; treat unknown Due Window as unspecified, never invent a deadline.",
                  "In AI by Zapier Settings > Output Fields, define three text output fields called Priority, Reason and Needs_Review. In the Prompt require Priority to be exactly P1, P2, P3 or Review; Reason to be one factual sentence using only submitted row fields; Needs_Review to be Yes whenever Task or Impact is missing, otherwise No. Preview the AI step with a test row. Explicitly tell it not to send emails, change external tasks, or interpret this suggested priority as an authorization to act.",
                  "Add the mandatory Google Sheets Update Spreadsheet Row action after AI by Zapier. Select the same Task Inbox worksheet. Map the Row field to the original New Spreadsheet Row trigger's row ID, not a fixed row number. Map AI output fields Priority, Reason, Needs_Review into their corresponding sheet columns. Preserve the original Task, Source, Due Window and Impact values if the action requests them. Test the update action and verify only the originating row changes.",
                  "Test expected output using sample input: 'Send client invoice' with Impact 'High' and a blank due window should produce Priority P1, Needs_Review No, and a reason based on high impact. Add 'Sort desk drawer' with Impact 'Low' and a blank due window as a separate new row: expected Priority P3 and Needs_Review No. Verify that each new row triggers the Zap once and receives its own result, without changing earlier rows or guessing an unknown deadline.",
                  "Test a negative failure case by adding a new row with Task 'Prepare summary' and an empty Impact value. The expected output is Priority Review and Needs_Review Yes rather than a guessed impact. Also test an empty Task; if a field is missing or an update goes to the wrong row, stop the Zap, correct the mapped trigger row ID and AI output fields, then repeat the test before enabling the automation.",
                  "Have a human review and approve each suggested P1 task and every Needs_Review Yes row before taking action. Only after reviewing the test results should you publish/turn on the Zap; watch the first live runs in Zap history. Use non-sensitive data and check current Zapier plan limits, AI task usage and account privacy settings before connecting real work. The workflow only labels rows: it does not send messages, execute tasks, or synchronize email/chat accounts automatically."
              ],
              
'caution': 'AI priorities may be wrong: review P1 decisions and flagged rows. Never include confidential data without authorization. Publishing AI by Zapier automations requires a paid Zapier plan; Free users can preview only. This guide follows vendor documentation and has not been independently tested end to end.',
              'source': DOC_URL,
              'source_label': 'Zapier: Use AI by Zapier to analyze and return data',
              'featured': False,
          }
          
          
          def shell(*args):
              r = subprocess.run(list(args), text=True, capture_output=True, check=False)
              if r.returncode:
                  raise RuntimeError(f'Command failed: {args[0]} {args[1] if len(args)>1 else ""}; inspect the Actions log')
              return r.stdout.strip()
          
          
          def api(path):
              url = 'https://api.github.com/repos/' + REPO + path
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          
          
          def check_fixed(item):
              assert item['slug'] == SLUG
              assert item['source'] == DOC_URL
              assert len(item['steps']) == 8
              assert not any('optional automation' in x.lower() for x in item['steps'])
              all_steps = ' '.join(item['steps']).lower()
              assert re.search(r'new spreadsheet row trigger', all_steps)
              assert re.search(r'update spreadsheet row action', all_steps)
              assert re.search(r'expected output', all_steps)
              assert re.search(r'sample input:', all_steps)
              assert re.search(r'negative failure', all_steps)
              assert re.search(r'human review and approve', all_steps)
              assert 'mock' not in all_steps and 'simulated' not in all_steps
              assert len({x.lower() for x in item['steps']}) == 8
              for s in item['steps']:
                  assert 35 <= len(s) <= 650, 'Step length out of guide validator bounds: '+str(len(s))
              return True
          
          
          def patch_catalog(catalog):
              assert isinstance(catalog, list) and len(catalog) >= 24
              target = [i for i,x in enumerate(catalog) if x.get('slug') == SLUG]
              if len(target) != 1:
                  raise RuntimeError('Expected exactly one existing PR #5 guide, got '+str(len(target)))
              index = target[0]
              original = catalog[index]
              if original.get('title') != FIXED['title']:
                  raise RuntimeError('Draft title unexpectedly changed; refusing to edit')
              result = [dict(x) for x in catalog]
              result[index] = FIXED.copy()
              assert result[:index] == catalog[:index] and result[index+1:] == catalog[index+1:]
              check_fixed(result[index])
              return result
          
          
          def main():
              if '--self-test' in sys.argv:
                  fixture = [{'slug':f'guide-{x}','title':f'Other guide {x}'} for x in range(24)] + [dict(FIXED, steps=['Old incomplete step'] * 7)]
                  updated = patch_catalog(fixture)
                  assert len(updated) == 25 and updated[24] == FIXED and updated[:24] == fixture[:24]
                  assert patch_catalog(updated) == updated
                  print('One-time repair self-test passed: 8 complete steps, safe catalog patch, valid source, no unrelated data changes.')
                  return
          
              if os.environ.get('GITHUB_REPOSITORY') != REPO:
                  raise RuntimeError('Incorrect repository; no changes made')
              if not os.environ.get('GITHUB_TOKEN'):
                  raise RuntimeError('Missing GitHub Actions token')
              pr = api('/pulls/5')
              if not (pr['state']=='open' and pr['draft'] and pr['base']['ref']=='main'
                      and pr['head']['repo']['full_name']==REPO and pr['head']['ref']==BRANCH):
                  raise RuntimeError('PR #5 is not the expected open, same-repository draft PR')
              current_head = shell('git','rev-parse','HEAD')
              if current_head != pr['head']['sha']:
                  raise RuntimeError('PR branch moved after checkout; refusing to overwrite newer work')
              if shell('git','status','--porcelain'):
                  raise RuntimeError('Checkout contains pre-existing modifications')
              target = Path('data/use_cases.json')
              catalog = json.loads(target.read_text(encoding='utf-8'))
              base_catalog = json.loads(shell('git','show','origin/main:data/use_cases.json'))
              if len(catalog)!=len(base_catalog)+1 or catalog[:-1]!=base_catalog or catalog[-1]['slug']!=SLUG:
                  raise RuntimeError('PR branch is not an untouched single-new-guide change on current main')
              target.write_text(json.dumps(patch_catalog(catalog),indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
              shell(sys.executable,'scripts/build.py')
              changes = {x for x in shell('git','ls-files','--modified','--others','--exclude-standard').splitlines() if x}
              if not REQUIRED_PATHS <= changes or not changes <= ALLOWED_PATHS:
                  raise RuntimeError('Unexpected generated files or missing guide: '+repr(sorted(changes)))
              html_path = Path('guides')/SLUG/'index.html'
              html_text = html_path.read_text(encoding='utf-8')
              for important in ('New Spreadsheet Row', 'Update Spreadsheet Row', 'Needs_Review', 'expected Priority P3'):
                  if important not in html_text:
                      raise RuntimeError('Generated HTML lacks required implementation detail: '+important)
              shell('git','config','user.name','github-actions[bot]')
              shell('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              shell('git','add','--',*sorted(changes))
              shell('git','commit','-m','Repair Milo PR 5 with a complete Zapier triage workflow')
              shell('git','push','origin','HEAD:'+BRANCH)
              print('Updated existing DRAFT PR #5 with repaired task triage workflow. Nothing merged to main.')
              step_summary=os.environ.get('GITHUB_STEP_SUMMARY')
              if step_summary:
                  with open(step_summary,'a',encoding='utf-8') as f:
                      f.write('### PR #5 corrected\n\nAutomated source-led tutorial prepared and site pages regenerated.\n'
                              'The six previous structural issues were addressed in local checks.\n'
                              '**Human testing and editorial approval are still required before merging.**\n')
          
          
          if __name__=='__main__':
              try: main()
              except (RuntimeError,AssertionError,ValueError,KeyError, OSError) as err:
                  print('Repair safely stopped: '+str(err),file=sys.stderr)
                  raise SystemExit(1)
          PY
          python /tmp/milo_repair_pr5.py --self-test
          python /tmp/milo_repair_pr5.py
