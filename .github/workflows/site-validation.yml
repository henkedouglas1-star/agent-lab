name: Reviewed site validation
on:
  pull_request:
    branches: [main, 'milo/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python milo_os.py --self-test
      - run: python -m unittest test_milo_v3_2
      - run: python scripts/build.py
      - run: git diff --exit-code
      - run: python scripts/validate_site.py --base-ref origin/main
