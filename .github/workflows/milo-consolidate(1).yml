name: Milo OS — One-time workflow consolidation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: milo-os-one-time-workflow-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    name: Validate and propose safe workflow cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify existing Milo engine
        run: python milo_os.py --self-test

      - name: Validate audited workflow before cleanup
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "Workflow YAML parsed successfully"' '.github/workflows/milo (1).yml'
          python - <<'PY'
          import ast
          import json
          import re
          import subprocess
          import textwrap
          from pathlib import Path

          root = Path('.')
          work = root / '.github/workflows'
          source = work / 'milo (1).yml'
          expected_source_sha = '7c1341c36f21ecaf9df1224cc0f8e35c8b0867f6'
          actual_sha = subprocess.check_output(['git', 'hash-object', str(source)], text=True).strip()
          if actual_sha != expected_source_sha:
              raise SystemExit('Audited workflow changed since validation; stop instead of guessing.')

          content = source.read_text(encoding='utf-8')
          required = ['name: Milo OS — Research to draft PR', 'audit_pr:',
                      'permissions:', 'contents: write', 'pull-requests: write',
                      "python milo_os.py --self-test", 'python milo_os.py',
                      'Editorial quality gate (never merges or publishes)',
                      "inputs.audit_pr == ''"]
          missing = [part for part in required if part not in content]
          if missing:
              raise SystemExit('Audited workflow missing required components: ' + ', '.join(missing))

          audit = re.search(r"cat > /tmp/milo_audit\.py <<'PY'\n(?P<script>[\s\S]*?)\n\s+PY\n\s+python /tmp/milo_audit\.py", content)
          if not audit:
              raise SystemExit('Cannot find embedded audit; refusing to replace canonical workflow.')
          ast.parse(textwrap.dedent(audit.group('script')), filename='milo_audit.py')
          print('Embedded audit Python parses successfully.')

          catalog = json.loads((root / 'data/use_cases.json').read_text(encoding='utf-8'))
          slug = 'automate-personal-task-prioritization-from-mixed-inputs-with-ai'
          articles = [x for x in catalog if x.get('slug') == slug]
          if len(articles) != 1 or len(catalog) < 25:
              raise SystemExit('Published first guide is missing; do not change workflows.')
          caution = articles[0].get('caution', '')
          if 'paid Zapier plan' not in caution or 'not been independently tested' not in caution:
              raise SystemExit('Published guide disclosure is missing; stop before cleanup.')
          if not (root / 'guides' / slug / 'index.html').is_file():
              raise SystemExit('Published guide HTML missing; do not change workflows.')
          print('Published content and disclosures preserved in current main.')
          PY

      - name: Consolidate workflows on a NEW branch only
        shell: bash
        env:
          CLEANUP_BRANCH: milo/consolidate-workflows-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || { echo 'Working tree not clean; stop'; exit 1; }
          git switch -c "$CLEANUP_BRANCH"
          python - <<'PY'
          from pathlib import Path
          work = Path('.github/workflows')
          source = work / 'milo (1).yml'
          canonical = work / 'milo.yml'
          remove = ['milo (1).yml', 'milo-v1.yml', 'milo-v2.yml',
                    'milo-v3.yml', 'milo-repair-pr5.yml', 'milo-consolidate(1).yml']
          required = [canonical, source] + [work / name for name in remove]
          missing = [str(x) for x in required if not x.is_file()]
          if missing:
              raise SystemExit('Expected existing workflow(s) missing; abort: ' + ', '.join(missing))
          canonical.write_bytes(source.read_bytes())
          for name in remove:
              (work / name).unlink()
          remaining = sorted(x.name for x in work.glob('milo*.yml'))
          if remaining != ['milo.yml']:
              raise SystemExit('Unexpected Milo workflows remain: ' + ', '.join(remaining))
          print('Exactly one Milo workflow remains in the PROPOSED BRANCH:', remaining[0])
          PY

          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "Consolidated YAML valid"' .github/workflows/milo.yml
          git add -A -- .github/workflows
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/milo.yml',
              '.github/workflows/milo (1).yml',
              '.github/workflows/milo-v1.yml',
              '.github/workflows/milo-v2.yml',
              '.github/workflows/milo-v3.yml',
              '.github/workflows/milo-repair-pr5.yml',
              '.github/workflows/milo-consolidate(1).yml',
          }
          paths = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if paths != expected:
              raise SystemExit('Unexpected staged changes; refuse commit: ' + repr(sorted(paths ^ expected)))
          print('Staged file allowlist verified: 7 workflow files, no site/content edits.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Milo OS: consolidate audited workflow and remove obsolete workflows'
          git push -u origin "$CLEANUP_BRANCH"
          echo "CLEANUP_BRANCH=$CLEANUP_BRANCH" >> "$GITHUB_ENV"

      - name: Open review-only consolidation pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['CLEANUP_BRANCH']
          payload = {
              'title': 'Milo OS: consolidate to one audited workflow',
              'head': branch,
              'base': 'main',
              'draft': True,
              'body': (
                  '## One-time Milo OS maintenance\n\n'
                  '- Replace `.github/workflows/milo.yml` with the already-tested audited workflow.\n'
                  '- Remove duplicate `milo (1).yml` and obsolete v1/v2/v3 workflows.\n'
                  '- Remove finished PR #5 repair workflow.\n'
                  '- Remove this temporary consolidation workflow itself.\n'
                  '- No edits to content, website pages, Python programs, billing or secrets.\n'
                  '- Research and QA remain **manual-triggered**, no automatic publication or schedule.\n\n'
                  '### Review before merge\n'
                  '- [ ] Exactly one `.github/workflows/milo.yml` remains.\n'
                  '- [ ] It has `audit_pr` mode and automatic post-generation audit.\n'
                  '- [ ] Existing 25 guides and published article remain untouched.\n'
                  '- [ ] Approve merging this workflow-only PR to main.\n'
              ),
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/pulls',
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  pr = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f'PR creation failed: HTTP {exc.code}. Review branch: https://github.com/{repo}/tree/{branch}')
              raise
          print('Draft maintenance PR created: ' + pr['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('### Milo consolidation ready for review\n\n' + pr['html_url'] + '\n')
          PY
