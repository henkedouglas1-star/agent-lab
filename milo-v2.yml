name: Milo v2 — Source-screened article drafts

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: milo-v2-review-draft
  cancel-in-progress: false

jobs:
  article-draft:
    name: Research and create a human-review article draft
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate source-screened research and draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MILO_GEMINI_MODEL: gemini-3.5-flash-lite
        run: python milo_v2.py
